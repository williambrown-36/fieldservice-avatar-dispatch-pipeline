[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldservice-avatar-pipeline"
version = "0.1.0"
description = "Upload and square-crop technician avatars while deriving work-order dispatch status."
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
